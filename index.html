<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tele-Safe AI — Ethiopian Digital Wallet Forensics</title>
    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111827;
            --bg-card: #1a1f2e;
            --bg-card-hover: #1e2433;
            --bg-input: #0d1220;
            --border: #2a3040;
            --border-accent: #3a4055;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --green: #10b981;
            --green-dark: #059669;
            --green-glow: rgba(16, 185, 129, 0.2);
            --red: #ef4444;
            --red-dark: #dc2626;
            --red-glow: rgba(239, 68, 68, 0.2);
            --gold: #f59e0b;
            --gold-dark: #d97706;
            --gold-glow: rgba(245, 158, 11, 0.15);
            --ethio-green: #078930;
            --ethio-yellow: #fcdd09;
            --ethio-red: #da121a;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.4);
            --shadow-glow: 0 0 40px rgba(0, 0, 0, 0.6);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'SF Pro Display', 'Inter', -apple-system, BlinkMacSystemFont, 'Roboto', 'Helvetica Neue', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(7, 137, 48, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 80%, rgba(245, 158, 11, 0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 50%, rgba(16, 185, 129, 0.02) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .app-container {
            max-width: 820px;
            margin: 0 auto;
            padding: 24px 20px 60px;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .app-header {
            text-align: center;
            padding: 28px 0 20px;
            position: relative;
        }
        .app-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 3px;
            background: linear-gradient(90deg, var(--ethio-green), var(--gold), var(--ethio-red));
            border-radius: 2px;
        }
        .logo-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(7, 137, 48, 0.25), rgba(245, 158, 11, 0.15));
            border: 2px solid rgba(7, 137, 48, 0.5);
            margin-bottom: 14px;
            font-size: 32px;
            box-shadow: 0 0 30px rgba(7, 137, 48, 0.2);
        }
        .app-title {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #a5f3fc 40%, #fbbf24 70%, #ffffff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }
        .app-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 1.2px;
            text-transform: uppercase;
            font-weight: 500;
        }
        .app-tagline {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
            letter-spacing: 0.5px;
        }

        /* Main Card */
        .main-card {
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-card);
            overflow: hidden;
            margin-top: 24px;
            transition: var(--transition);
        }
        .main-card:hover {
            border-color: var(--border-accent);
        }

        .card-header {
            padding: 20px 24px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .card-header-title {
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
        }
        .card-header-badge {
            font-size: 0.7rem;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(245, 158, 11, 0.12);
            color: var(--gold);
            border: 1px solid rgba(245, 158, 11, 0.3);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .card-body {
            padding: 20px 24px;
        }

        /* Textarea */
        .input-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }
        .input-textarea {
            width: 100%;
            min-height: 180px;
            padding: 16px 18px;
            background: var(--bg-input);
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
            font-size: 0.85rem;
            line-height: 1.7;
            resize: vertical;
            transition: var(--transition);
            outline: none;
            letter-spacing: 0.2px;
        }
        .input-textarea:focus {
            border-color: rgba(245, 158, 11, 0.5);
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.08);
        }
        .input-textarea::placeholder {
            color: var(--text-muted);
            font-style: italic;
        }

        /* Buttons */
        .btn-row {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 24px;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            outline: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            font-family: inherit;
        }
        .btn-primary {
            background: linear-gradient(135deg, #059669, #10b981);
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.3);
            flex: 1;
            min-width: 200px;
            justify-content: center;
            font-size: 0.9rem;
            padding: 14px 28px;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(16, 185, 129, 0.4);
            background: linear-gradient(135deg, #10b981, #34d399);
        }
        .btn-primary:active {
            transform: translateY(0);
            box-shadow: 0 2px 10px rgba(16, 185, 129, 0.2);
        }
        .btn-secondary {
            background: var(--bg-card-hover);
            color: var(--text-secondary);
            border: 1px solid var(--border-accent);
            font-size: 0.75rem;
            padding: 10px 16px;
            letter-spacing: 0.5px;
        }
        .btn-secondary:hover {
            border-color: var(--gold);
            color: var(--gold);
            background: rgba(245, 158, 11, 0.08);
            transform: translateY(-1px);
        }
        .btn-danger {
            background: rgba(239, 68, 68, 0.12);
            color: var(--red);
            border: 1px solid rgba(239, 68, 68, 0.3);
            font-size: 0.75rem;
            padding: 10px 16px;
            letter-spacing: 0.5px;
        }
        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.6);
        }

        /* Sample chips */
        .sample-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .sample-chip {
            font-size: 0.7rem;
            padding: 6px 14px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
            font-weight: 500;
            letter-spacing: 0.3px;
            font-family: inherit;
        }
        .sample-chip:hover {
            border-color: var(--gold);
            color: var(--gold);
            background: rgba(245, 158, 11, 0.07);
        }

        /* Results */
        .results-section {
            margin-top: 24px;
            display: none;
            animation: fadeInUp 0.5s ease-out;
        }
        .results-section.visible {
            display: block;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes pulse {
            0%,
            100% {
                box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
            }
            50% {
                box-shadow: 0 0 40px rgba(16, 185, 129, 0.6);
            }
        }
        @keyframes pulseRed {
            0%,
            100% {
                box-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
            }
            50% {
                box-shadow: 0 0 40px rgba(239, 68, 68, 0.6);
            }
        }

        .result-card {
            border-radius: var(--radius-lg);
            padding: 28px 24px;
            border: 2px solid;
            position: relative;
            overflow: hidden;
            transition: var(--transition);
        }
        .result-card.pass {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.08), rgba(5, 150, 105, 0.06));
            border-color: var(--green);
            animation: pulse 2s ease-in-out infinite;
        }
        .result-card.fail {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.08), rgba(220, 38, 38, 0.06));
            border-color: var(--red);
            animation: pulseRed 2s ease-in-out infinite;
        }

        .result-icon {
            font-size: 3rem;
            margin-bottom: 8px;
            display: block;
        }
        .result-title {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.3px;
            margin-bottom: 4px;
        }
        .result-card.pass .result-title {
            color: var(--green);
        }
        .result-card.fail .result-title {
            color: var(--red);
        }
        .result-detail {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 6px;
            line-height: 1.5;
        }
        .result-card.pass .result-detail {
            color: #a7f3d0;
        }
        .result-card.fail .result-detail {
            color: #fca5a5;
        }

        /* Individual test results */
        .test-results {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .test-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 14px 18px;
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            transition: var(--transition);
        }
        .test-item.pass-item {
            border-left: 3px solid var(--green);
            background: rgba(16, 185, 129, 0.04);
        }
        .test-item.fail-item {
            border-left: 3px solid var(--red);
            background: rgba(239, 68, 68, 0.04);
        }
        .test-icon {
            font-size: 1.2rem;
            flex-shrink: 0;
            margin-top: 1px;
        }
        .test-content {
            flex: 1;
        }
        .test-name {
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--text-primary);
            letter-spacing: 0.2px;
        }
        .test-description {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
            line-height: 1.4;
        }

        /* Extracted data */
        .extracted-data {
            margin-top: 20px;
            padding: 18px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }
        .extracted-title {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }
        .data-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
        }
        .data-item {
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .data-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 600;
        }
        .data-value {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-top: 2px;
            font-family: 'SF Mono', 'Cascadia Code', monospace;
        }
        .data-value.amount {
            color: var(--gold);
        }
        .data-value.balance {
            color: var(--green);
        }
        .data-value.ref {
            color: #60a5fa;
        }

        /* Footer */
        .app-footer {
            text-align: center;
            margin-top: 32px;
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }
        .app-footer a {
            color: var(--gold);
            text-decoration: none;
        }
        .app-footer a:hover {
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .app-container {
                padding: 16px 12px 40px;
            }
            .app-title {
                font-size: 1.5rem;
            }
            .card-header {
                padding: 16px 18px 12px;
            }
            .card-body {
                padding: 16px 18px;
            }
            .result-card {
                padding: 20px 16px;
            }
            .result-title {
                font-size: 1.1rem;
            }
            .btn-primary {
                font-size: 0.8rem;
                padding: 12px 20px;
            }
            .data-grid {
                grid-template-columns: 1fr 1fr;
            }
            .input-textarea {
                min-height: 140px;
                font-size: 0.78rem;
            }
        }
        @media (max-width: 400px) {
            .data-grid {
                grid-template-columns: 1fr;
            }
            .btn-row {
                flex-direction: column;
            }
            .btn-primary {
                width: 100%;
            }
        }

        /* Loading spinner */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-accent);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo-badge">🛡️</div>
            <h1 class="app-title">Tele-Safe AI</h1>
            <div class="app-subtitle">Ethiopian Digital Wallet Forensics</div>
            <div class="app-tagline">Telebirr &amp; CBE Transaction Text Auditor — 100% Local</div>
        </header>

        <!-- Main Scanner Card -->
        <div class="main-card">
            <div class="card-header">
                <span class="card-header-title">🔍 Text Forensic Scanner</span>
                <span class="card-header-badge">⚡ Local Analysis Engine</span>
            </div>
            <div class="card-body">
                <label class="input-label" for="smsInput">📩 Paste SMS or Telegram transaction text</label>
                <textarea id="smsInput" class="input-textarea" placeholder="Paste your Telebirr or CBE SMS/Telegram text here..." spellcheck="false"></textarea>

                <div class="sample-row" id="sampleRow">
                    <button class="sample-chip" data-sample="telebirr_credit">📲 Telebirr Credit</button>
                    <button class="sample-chip" data-sample="cbe_credit">🏦 CBE Credit</button>
                    <button class="sample-chip" data-sample="telebirr_debit">💸 Telebirr Debit</button>
                    <button class="sample-chip" data-sample="fraud">🚨 Tampered (Fraud)</button>
                    <button class="sample-chip" data-sample="fraud2">🚨 Math Inconsistency</button>
                </div>

                <div class="btn-row">
                    <button id="scanBtn" class="btn btn-primary">🔒 RUN FORENSIC SCAN</button>
                    <button id="clearBtn" class="btn btn-secondary">✕ Clear</button>
                </div>
            </div>
        </div>

        <!-- Results Section -->
        <div id="resultsSection" class="results-section">
            <div id="resultCard" class="result-card">
                <!-- Dynamically populated -->
            </div>
        </div>

        <!-- Footer -->
        <footer class="app-footer">
            Tele-Safe AI &bull; Client-Side Forensic Engine &bull; Runs 100% Locally &bull; No External APIs
        </footer>
    </div>

    <script>
        (function() {
            'use strict';

            // ─── DOM References ───────────────────────────────────────────
            const smsInput = document.getElementById('smsInput');
            const scanBtn = document.getElementById('scanBtn');
            const clearBtn = document.getElementById('clearBtn');
            const resultsSection = document.getElementById('resultsSection');
            const resultCard = document.getElementById('resultCard');
            const sampleRow = document.getElementById('sampleRow');

            // ─── Sample Texts ─────────────────────────────────────────────
            const SAMPLE_TEXTS = {
                telebirr_credit: 'Ethio telecom: Your telebirr account has received ETB 2,500.00 from ABEBE KEBEDE (Phone: 0912345678). Your previous balance was ETB 3,200.00. Your current balance is ETB 5,700.00. Reference: TB4829130456. Date: 2025-07-21 14:35:00',
                cbe_credit: 'Commercial Bank of Ethiopia: Your account has been credited with ETB 10,000.00 from CHALA TRADING PLC. Your previous balance was ETB 45,500.00. Your current balance is ETB 55,500.00. Ref: FT2025072109B6X2. Date: 2025-07-21 09:12:45',
                telebirr_debit: 'Ethio telecom: Your telebirr account has transferred ETB 800.00 to MESERET ALEMU (Phone: 0923456789). Your previous balance was ETB 4,000.00. Your current balance is ETB 3,200.00. Reference: TB7728193451. Date: 2025-07-20 18:22:10',
                fraud: 'Ethio telecom: Your telebirr account has received ETB 25,000.00 from ABEBE KEBEDE (Phone: 0912345678). Your previous balance was ETB 3,200.00. Your current balance is ETB 5,700.00. Reference: TB123. Date: 2025-07-21 14:35:00',
                fraud2: 'Commercial Bank of Ethiopia: Your account has been credited with ETB 50,000.00 from CHALA TRADING PLC. Your previous balance was ETB 45,500.00. Your current balance is ETB 55,500.00. Ref: FT2025072109B6X2. Date: 2025-02-30 09:12:45'
            };

            // ─── Regex Patterns ───────────────────────────────────────────
            const REGEX = {
                // Platform detection
                telebirrKeyword: /(ethio\s*telecom|telebirr|ethiotelecom)/i,
                cbeKeyword: /(commercial\s*bank\s*of\s*ethiopia|\bCBE\b|commercial\s*bank)/i,

                // Transaction ID patterns
                telebirrID: /(?:TB|TBR|TBF)\s*\d{8,15}/i,
                telebirrIDAlt: /\b(?:TB|TBR|TBF)\d{8,15}\b/i,
                cbeID: /\bFT\d{10,16}\b/i,
                cbeIDAlt: /(?:CBE|Ref)\s*[:#]?\s*([A-Z0-9]{8,20})/i,
                genericRef: /\b(?:reference|ref|trx|txn)\s*[:#]?\s*([A-Z0-9]{8,20})\b/i,

                // Amount extraction — with currency
                amountETB: /ETB\s*([\d,]+(?:\.\d{1,2})?)/gi,
                amountBirr: /\bbirr\s*([\d,]+(?:\.\d{1,2})?)/gi,
                amountBr: /\bBr\.?\s*([\d,]+(?:\.\d{1,2})?)/gi,

                // Previous balance
                prevBalance: /previous\s*balance\s*(?:was|is|:)?\s*(?:ETB\s*)?([\d,]+(?:\.\d{1,2})?)/i,
                prevBalanceAlt: /balance\s*before\s*(?:was|is|:)?\s*(?:ETB\s*)?([\d,]+(?:\.\d{1,2})?)/i,
                prevBalanceAlt2: /old\s*balance\s*(?:was|is|:)?\s*(?:ETB\s*)?([\d,]+(?:\.\d{1,2})?)/i,

                // Current balance
                currentBalance: /(?:current|new|available|remaining)\s*balance\s*(?:is|:|was)?\s*(?:ETB\s*)?([\d,]+(?:\.\d{1,2})?)/i,
                currentBalanceSimple: /balance\s*(?:is|:|was)?\s*(?:ETB\s*)?([\d,]+(?:\.\d{1,2})?)/i,

                // Transaction amount (received/credited/sent/transferred/paid)
                receivedAmount: /(?:received|credited|deposited)\s+(?:ETB\s*)?([\d,]+(?:\.\d{1,2})?)/i,
                sentAmount: /(?:transferred|sent|paid|debited|withdrawn)\s+(?:ETB\s*)?([\d,]+(?:\.\d{1,2})?)/i,
                amountAfterKeyword: /(?:amount\s*of)\s*(?:ETB\s*)?([\d,]+(?:\.\d{1,2})?)/i,

                // Timestamp
                dateTimeFull: /(\d{4})[-/](\d{1,2})[-/](\d{1,2})[T\s]+(\d{1,2}):(\d{2})(?::(\d{2}))?/,
                dateTimeSlash: /(\d{1,2})[/](\d{1,2})[/](\d{4})[T\s]+(\d{1,2}):(\d{2})(?::(\d{2}))?/,
                dateOnly: /(\d{4})[-/](\d{1,2})[-/](\d{1,2})/,
                timeOnly: /(\d{1,2}):(\d{2})(?::(\d{2}))?/,

                // Credit/debit detection
                creditKeyword: /(received|credited|deposited|incoming|added)/i,
                debitKeyword: /(transferred|sent|paid|debited|withdrawn|outgoing|deducted)/i,
            };

            // ─── Utility Functions ────────────────────────────────────────
            function parseNumber(str) {
                if (!str) return null;
                const cleaned = str.replace(/,/g, '').trim();
                const num = parseFloat(cleaned);
                return isNaN(num) ? null : num;
            }

            function extractAllAmounts(text) {
                const amounts = [];
                const patterns = [REGEX.amountETB, REGEX.amountBirr, REGEX.amountBr];
                patterns.forEach(pattern => {
                    pattern.lastIndex = 0;
                    let match;
                    while ((match = pattern.exec(text)) !== null) {
                        const val = parseNumber(match[1]);
                        if (val !== null) amounts.push(val);
                    }
                });
                // Also try generic number extraction after currency keywords
                const genericPattern = /(?:ETB|Birr|Br\.?)\s*([\d,]+(?:\.\d{1,2})?)/gi;
                genericPattern.lastIndex = 0;
                let gm;
                while ((gm = genericPattern.exec(text)) !== null) {
                    const val = parseNumber(gm[1]);
                    if (val !== null && !amounts.includes(val)) amounts.push(val);
                }
                return amounts;
            }

            function isLeapYear(year) {
                return (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0);
            }

            function daysInMonth(month, year) {
                const days = [31, isLeapYear(year) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
                return days[month - 1] || 0;
            }

            function identifyPlatform(text) {
                const isTelebirr = REGEX.telebirrKeyword.test(text);
                const isCBE = REGEX.cbeKeyword.test(text);
                if (isTelebirr && isCBE) return 'ambiguous';
                if (isTelebirr) return 'telebirr';
                if (isCBE) return 'cbe';
                return 'unknown';
            }

            function findTimestamp(text) {
                // Try full datetime formats
                let match = REGEX.dateTimeFull.exec(text);
                if (match) {
                    return {
                        year: parseInt(match[1]),
                        month: parseInt(match[2]),
                        day: parseInt(match[3]),
                        hour: parseInt(match[4]),
                        minute: parseInt(match[5]),
                        second: match[6] ? parseInt(match[6]) : 0,
                        raw: match[0]
                    };
                }
                match = REGEX.dateTimeSlash.exec(text);
                if (match) {
                    return {
                        year: parseInt(match[3]),
                        month: parseInt(match[2]),
                        day: parseInt(match[1]),
                        hour: parseInt(match[4]),
                        minute: parseInt(match[5]),
                        second: match[6] ? parseInt(match[6]) : 0,
                        raw: match[0]
                    };
                }
                // Date only
                match = REGEX.dateOnly.exec(text);
                if (match) {
                    return {
                        year: parseInt(match[1]),
                        month: parseInt(match[2]),
                        day: parseInt(match[3]),
                        hour: null,
                        minute: null,
                        second: null,
                        raw: match[0]
                    };
                }
                return null;
            }

            function validateTimestamp(ts) {
                if (!ts) return { valid: false, reason: 'No date/time string found in text.' };
                if (ts.year < 2000 || ts.year > 2035) {
                    return { valid: false, reason: `Year ${ts.year} is outside plausible range (2000-2035).` };
                }
                if (ts.month < 1 || ts.month > 12) {
                    return { valid: false, reason: `Month ${ts.month} is invalid (must be 1-12).` };
                }
                const maxDay = daysInMonth(ts.month, ts.year);
                if (ts.day < 1 || ts.day > maxDay) {
                    return { valid: false, reason: `Day ${ts.day} is invalid for month ${ts.month}, year ${ts.year} (max: ${maxDay}).` };
                }
                if (ts.hour !== null) {
                    if (ts.hour < 0 || ts.hour > 23) {
                        return { valid: false, reason: `Hour ${ts.hour} is invalid (must be 0-23).` };
                    }
                    if (ts.minute < 0 || ts.minute > 59) {
                        return { valid: false, reason: `Minute ${ts.minute} is invalid (must be 0-59).` };
                    }
                    if (ts.second !== null && (ts.second < 0 || ts.second > 59)) {
                        return { valid: false, reason: `Second ${ts.second} is invalid (must be 0-59).` };
                    }
                }
                return { valid: true, reason: 'Timestamp is mathematically valid.' };
            }

            function checkTransactionID(text, platform) {
                const results = { valid: false, details: '', rawID: null };

                if (platform === 'telebirr') {
                    // Check Telebirr ID format
                    const tbMatch = REGEX.telebirrID.exec(text) || REGEX.telebirrIDAlt.exec(text);
                    if (tbMatch) {
                        const id = tbMatch[0].replace(/\s+/g, '');
                        results.rawID = id;
                        const digits = id.replace(/[^0-9]/g, '');
                        if (digits.length >= 8 && digits.length <= 15) {
                            results.valid = true;
                            results.details = `Telebirr ID "${id}" matches official structure (${digits.length} digits).`;
                        } else {
                            results.valid = false;
                            results.details =
                                `Telebirr ID "${id}" has ${digits.length} digits — expected 8-15 digits in official format.`;
                        }
                    } else {
                        // Check generic reference
                        const genMatch = REGEX.genericRef.exec(text);
                        if (genMatch) {
                            const id = genMatch[1];
                            results.rawID = id;
                            results.valid = false;
                            results.details = `Reference "${id}" does not match Telebirr official ID pattern (TB + 8-15 digits).`;
                        } else {
                            results.valid = false;
                            results.details = 'No transaction reference ID found in the text.';
                        }
                    }
                } else if (platform === 'cbe') {
                    const ftMatch = REGEX.cbeID.exec(text);
                    const cbeAltMatch = REGEX.cbeIDAlt.exec(text);
                    if (ftMatch) {
                        const id = ftMatch[0];
                        results.rawID = id;
                        const digits = id.replace(/[^0-9]/g, '');
                        if (digits.length >= 10 && digits.length <= 16) {
                            results.valid = true;
                            results.details = `CBE ID "${id}" matches official structure (FT + 10-16 alphanumeric).`;
                        } else {
                            results.valid = false;
                            results.details =
                                `CBE ID "${id}" has ${digits.length} digits — expected 10-16 in official FT format.`;
                        }
                    } else if (cbeAltMatch) {
                        const id = cbeAltMatch[1] || cbeAltMatch[0];
                        results.rawID = id;
                        results.valid = false;
                        results.details = `Reference "${id}" does not match CBE official FT pattern.`;
                    } else {
                        const genMatch = REGEX.genericRef.exec(text);
                        if (genMatch) {
                            results.rawID = genMatch[1];
                            results.valid = false;
                            results.details = `Reference "${genMatch[1]}" does not match CBE official FT ID format.`;
                        } else {
                            results.valid = false;
                            results.details = 'No transaction reference ID found in the text.';
                        }
                    }
                } else if (platform === 'unknown') {
                    // Try both patterns
                    const tbMatch = REGEX.telebirrID.exec(text) || REGEX.telebirrIDAlt.exec(text);
                    const ftMatch = REGEX.cbeID.exec(text);
                    if (tbMatch) {
                        const id = tbMatch[0].replace(/\s+/g, '');
                        results.rawID = id;
                        const digits = id.replace(/[^0-9]/g, '');
                        results.valid = digits.length >= 8 && digits.length <= 15;
                        results.details = results.valid ?
                            `Telebirr-style ID "${id}" found (platform not explicitly stated).` :
                            `ID "${id}" found but platform not identified and format may not be official.`;
                    } else if (ftMatch) {
                        const id = ftMatch[0];
                        results.rawID = id;
                        const digits = id.replace(/[^0-9]/g, '');
                        results.valid = digits.length >= 10 && digits.length <= 16;
                        results.details = results.valid ?
                            `CBE-style ID "${id}" found (platform not explicitly stated).` :
                            `ID "${id}" found but platform not identified and format may not be official.`;
                    } else {
                        results.valid = false;
                        results.details = 'No transaction ID found and platform not identified.';
                    }
                } else {
                    results.valid = false;
                    results.details = 'Ambiguous platform — both Telebirr and CBE keywords detected. Cannot verify ID against a single standard.';
                }
                return results;
            }

            function checkKeywords(text, platform) {
                const results = { valid: false, details: '', foundKeywords: [] };
                const hasTelebirr = REGEX.telebirrKeyword.test(text);
                const hasCBE = REGEX.cbeKeyword.test(text);

                if (hasTelebirr) results.foundKeywords.push('Ethio telecom / Telebirr');
                if (hasCBE) results.foundKeywords.push('Commercial Bank of Ethiopia / CBE');

                if (platform === 'telebirr') {
                    if (hasTelebirr && !hasCBE) {
                        results.valid = true;
                        results.details = 'Official Telebirr keyword detected: "Ethio telecom" or "telebirr".';
                    } else if (hasTelebirr && hasCBE) {
                        results.valid = false;
                        results.details = 'Both Telebirr and CBE keywords found — ambiguous source.';
                    } else {
                        results.valid = false;
                        results.details = 'No official Telebirr keyword ("Ethio telecom" / "telebirr") detected.';
                    }
                } else if (platform === 'cbe') {
                    if (hasCBE && !hasTelebirr) {
                        results.valid = true;
                        results.details = 'Official CBE keyword detected: "Commercial Bank of Ethiopia" / "CBE".';
                    } else if (hasCBE && hasTelebirr) {
                        results.valid = false;
                        results.details = 'Both CBE and Telebirr keywords found — ambiguous source.';
                    } else {
                        results.valid = false;
                        results.details = 'No official CBE keyword ("Commercial Bank of Ethiopia" / "CBE") detected.';
                    }
                } else if (platform === 'unknown') {
                    results.valid = false;
                    results.details = 'No recognized platform keyword found. Text must contain "Ethio telecom", "telebirr", or "Commercial Bank of Ethiopia".';
                } else {
                    results.valid = false;
                    results.details = 'Ambiguous platform identification.';
                }
                return results;
            }

            function checkMathBalance(text, platform) {
                const results = {
                    valid: false,
                    details: '',
                    amount: null,
                    currentBalance: null,
                    previousBalance: null,
                    isCredit: null,
                    mathCheck: null
                };

                // Determine credit or debit
                const isCredit = REGEX.creditKeyword.test(text);
                const isDebit = REGEX.debitKeyword.test(text);

                // Extract previous balance
                let prevMatch = REGEX.prevBalance.exec(text);
                if (!prevMatch) prevMatch = REGEX.prevBalanceAlt.exec(text);
                if (!prevMatch) prevMatch = REGEX.prevBalanceAlt2.exec(text);
                const prevBalance = prevMatch ? parseNumber(prevMatch[1]) : null;

                // Extract current balance
                let currMatch = REGEX.currentBalance.exec(text);
                if (!currMatch) currMatch = REGEX.currentBalanceSimple.exec(text);
                const currBalance = currMatch ? parseNumber(currMatch[1]) : null;

                // Extract transaction amount
                let amount = null;
                let amountMatch = REGEX.receivedAmount.exec(text);
                if (amountMatch) {
                    amount = parseNumber(amountMatch[1]);
                } else {
                    amountMatch = REGEX.sentAmount.exec(text);
                    if (amountMatch) amount = parseNumber(amountMatch[1]);
                }
                if (amount === null) {
                    amountMatch = REGEX.amountAfterKeyword.exec(text);
                    if (amountMatch) amount = parseNumber(amountMatch[1]);
                }

                results.amount = amount;
                results.currentBalance = currBalance;
                results.previousBalance = prevBalance;
                results.isCredit = isCredit;

                // If amount not found via keyword, try to infer from all amounts
                if (amount === null) {
                    const allAmounts = extractAllAmounts(text);
                    if (allAmounts.length >= 2) {
                        // If we have prev and curr, the amount is the difference
                        if (prevBalance !== null && currBalance !== null) {
                            const diff = Math.abs(currBalance - prevBalance);
                            if (diff > 0) {
                                amount = diff;
                                results.amount = amount;
                                results.details =
                                    `Amount inferred from balance difference: |${currBalance} - ${prevBalance}| = ${diff}.`;
                            }
                        }
                    }
                }

                // Math check
                if (prevBalance !== null && currBalance !== null && amount !== null) {
                    const epsilon = 0.01;
                    let expected;
                    if (isCredit) {
                        expected = prevBalance + amount;
                        const diff = Math.abs(expected - currBalance);
                        if (diff <= epsilon) {
                            results.valid = true;
                            results.mathCheck = 'pass';
                            results.details =
                                `Math verified: Previous (${prevBalance}) + Amount (${amount}) = ${expected} ≈ Current (${currBalance}). ✓`;
                        } else {
                            results.valid = false;
                            results.mathCheck = 'fail';
                            results.details =
                                `🚨 Mathematical inconsistency: Previous (${prevBalance}) + Amount (${amount}) = ${expected}, but Current balance is ${currBalance}. Difference: ${diff.toFixed(2)} ETB.`;
                        }
                    } else if (isDebit) {
                        expected = prevBalance - amount;
                        const diff = Math.abs(expected - currBalance);
                        if (diff <= epsilon) {
                            results.valid = true;
                            results.mathCheck = 'pass';
                            results.details =
                                `Math verified: Previous (${prevBalance}) - Amount (${amount}) = ${expected} ≈ Current (${currBalance}). ✓`;
                        } else {
                            results.valid = false;
                            results.mathCheck = 'fail';
                            results.details =
                                `🚨 Mathematical inconsistency: Previous (${prevBalance}) - Amount (${amount}) = ${expected}, but Current balance is ${currBalance}. Difference: ${diff.toFixed(2)} ETB.`;
                        }
                    } else {
                        // Can't determine credit/debit, but check if numbers are close either way
                        const creditDiff = Math.abs(prevBalance + amount - currBalance);
                        const debitDiff = Math.abs(prevBalance - amount - currBalance);
                        if (creditDiff <= epsilon || debitDiff <= epsilon) {
                            results.valid = true;
                            results.mathCheck = 'pass';
                            results.details = `Math verified: Numbers are mathematically consistent. ✓`;
                        } else {
                            results.valid = false;
                            results.mathCheck = 'fail';
                            results.details =
                                `🚨 Mathematical inconsistency: No consistent relationship found between Previous (${prevBalance}), Amount (${amount}), and Current (${currBalance}).`;
                        }
                    }
                } else if (currBalance !== null && amount !== null && prevBalance === null) {
                    // Only have current balance and amount — check plausibility
                    if (isCredit && currBalance < amount) {
                        results.valid = false;
                        results.details =
                            `🚨 Suspicious: Credit of ${amount} ETB but current balance (${currBalance}) is less than the credit amount.`;
                    } else if (isDebit && currBalance < 0) {
                        results.valid = false;
                        results.details = `🚨 Suspicious: Debit of ${amount} ETB leads to negative balance (${currBalance}).`;
                    } else if (amount !== null && currBalance !== null && amount > 0 && currBalance >= 0) {
                        results.valid = true;
                        results.details = `No previous balance found — cannot verify full math. Basic plausibility check passed (amount: ${amount}, balance: ${currBalance}).`;
                    } else {
                        results.valid = false;
                        results.details = 'Insufficient data for math verification. Previous balance not found.';
                    }
                } else if (prevBalance !== null && currBalance !== null && amount === null) {
                    // Have prev and curr but no explicit amount
                    const diff = Math.abs(currBalance - prevBalance);
                    if (diff > 0) {
                        results.valid = true;
                        results.details = `No explicit amount found, but balance changed from ${prevBalance} to ${currBalance} (Δ=${diff}). Math structurally consistent.`;
                    } else {
                        results.valid = false;
                        results.details = 'No explicit amount found and no balance change detected — suspicious.';
                    }
                } else {
                    results.valid = false;
                    results.details = 'Insufficient numeric data to perform math audit. Transaction amount and current balance required.';
                }
                return results;
            }

            // ─── Main Scan Function ───────────────────────────────────────
            function runScan() {
                const text = smsInput.value.trim();

                if (!text) {
                    showError('⚠️ Please paste SMS or Telegram text first.');
                    return;
                }

                if (text.length < 20) {
                    showError('⚠️ Text is too short to be a valid transaction message. Please paste the full SMS/Telegram text.');
                    return;
                }

                // Brief loading state
                scanBtn.innerHTML = '<span class="spinner"></span> SCANNING...';
                scanBtn.disabled = true;

                setTimeout(() => {
                    try {
                        const platform = identifyPlatform(text);
                        const idResult = checkTransactionID(text, platform);
                        const kwResult = checkKeywords(text, platform);
                        const mathResult = checkMathBalance(text, platform);
                        const ts = findTimestamp(text);
                        const tsResult = validateTimestamp(ts);

                        const allPassed = idResult.valid && kwResult.valid && mathResult.valid && tsResult.valid;

                        renderResults({
                            platform,
                            idResult,
                            kwResult,
                            mathResult,
                            tsResult,
                            ts,
                            allPassed,
                            rawText: text
                        });

                    } catch (err) {
                        showError('⚠️ Error during scan: ' + err.message);
                    } finally {
                        scanBtn.innerHTML = '🔒 RUN FORENSIC SCAN';
                        scanBtn.disabled = false;
                    }
                }, 350);
            }

            function showError(msg) {
                resultsSection.classList.add('visible');
                resultCard.className = 'result-card fail';
                resultCard.innerHTML = `
                    <span class="result-icon">⚠️</span>
                    <div class="result-title">SCAN ERROR</div>
                    <div class="result-detail">${msg}</div>
                `;
            }

            function renderResults(data) {
                const { platform, idResult, kwResult, mathResult, tsResult, ts, allPassed, rawText } = data;
                const platformNames = { telebirr: '📱 Telebirr', cbe: '🏦 CBE', unknown: '❓ Unknown', ambiguous: '⚠️ Ambiguous' };
                const platformName = platformNames[platform] || platform;

                let html = '';

                if (allPassed) {
                    html += `
                        <div class="result-card pass">
                            <span class="result-icon">✅</span>
                            <div class="result-title">AUDIT PASSED: AUTHENTIC TEXT TRANSACTION</div>
                            <div class="result-detail">All structural, mathematical, and timestamp checks passed. This text appears to be a genuine ${platformName} transaction message.</div>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="result-card fail">
                            <span class="result-icon">🚨</span>
                            <div class="result-title">FRAUD DETECTED: RULE VIOLATION</div>
                            <div class="result-detail">One or more forensic checks failed. Detailed breakdown below.</div>
                        </div>
                    `;
                }

                // Platform
                html += `
                    <div class="test-results">
                        <div class="test-item ${platform !== 'unknown' && platform !== 'ambiguous' ? 'pass-item' : 'fail-item'}">
                            <span class="test-icon">${platform !== 'unknown' && platform !== 'ambiguous' ? '✅' : '❌'}</span>
                            <div class="test-content">
                                <div class="test-name">Platform Identification</div>
                                <div class="test-description">${platformName} detected.</div>
                            </div>
                        </div>
                        <div class="test-item ${idResult.valid ? 'pass-item' : 'fail-item'}">
                            <span class="test-icon">${idResult.valid ? '✅' : '❌'}</span>
                            <div class="test-content">
                                <div class="test-name">Transaction ID Verification</div>
                                <div class="test-description">${idResult.details}</div>
                                ${idResult.rawID ? `<div style="font-size:0.7rem;color:var(--text-muted);margin-top:4px;font-family:monospace;">ID: ${idResult.rawID}</div>` : ''}
                            </div>
                        </div>
                        <div class="test-item ${kwResult.valid ? 'pass-item' : 'fail-item'}">
                            <span class="test-icon">${kwResult.valid ? '✅' : '❌'}</span>
                            <div class="test-content">
                                <div class="test-name">Keyword & Mandatory Marker Check</div>
                                <div class="test-description">${kwResult.details}${kwResult.foundKeywords.length ? ` Found: ${kwResult.foundKeywords.join(', ')}.` : ''}</div>
                            </div>
                        </div>
                        <div class="test-item ${mathResult.valid ? 'pass-item' : 'fail-item'}">
                            <span class="test-icon">${mathResult.valid ? '✅' : '❌'}</span>
                            <div class="test-content">
                                <div class="test-name">Math Balance Auditor</div>
                                <div class="test-description">${mathResult.details}</div>
                            </div>
                        </div>
                        <div class="test-item ${tsResult.valid ? 'pass-item' : 'fail-item'}">
                            <span class="test-icon">${tsResult.valid ? '✅' : '❌'}</span>
                            <div class="test-content">
                                <div class="test-name">Timestamp Validity Check</div>
                                <div class="test-description">${tsResult.details}${ts ? ` Extracted: ${ts.raw}` : ''}</div>
                            </div>
                        </div>
                    </div>
                `;

                // Extracted data section
                html += `
                    <div class="extracted-data">
                        <div class="extracted-title">📊 Extracted Transaction Metrics</div>
                        <div class="data-grid">
                            <div class="data-item">
                                <div class="data-label">Platform</div>
                                <div class="data-value">${platformName}</div>
                            </div>
                            <div class="data-item">
                                <div class="data-label">Transaction Amount</div>
                                <div class="data-value amount">${mathResult.amount !== null ? 'ETB ' + mathResult.amount.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) : 'N/A'}</div>
                            </div>
                            <div class="data-item">
                                <div class="data-label">Current Balance</div>
                                <div class="data-value balance">${mathResult.currentBalance !== null ? 'ETB ' + mathResult.currentBalance.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) : 'N/A'}</div>
                            </div>
                            <div class="data-item">
                                <div class="data-label">Previous Balance</div>
                                <div class="data-value">${mathResult.previousBalance !== null ? 'ETB ' + mathResult.previousBalance.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) : 'N/A'}</div>
                            </div>
                            <div class="data-item">
                                <div class="data-label">Transaction Type</div>
                                <div class="data-value">${mathResult.isCredit === true ? 'Credit' : mathResult.isCredit === false ? 'Debit' : 'Unknown'}</div>
                            </div>
                            <div class="data-item">
                                <div class="data-label">Reference ID</div>
                                <div class="data-value ref">${idResult.rawID || 'N/A'}</div>
                            </div>
                        </div>
                    </div>
                `;

                resultCard.innerHTML = html;
                resultsSection.classList.add('visible');
                resultsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }

            // ─── Event Listeners ──────────────────────────────────────────
            scanBtn.addEventListener('click', runScan);

            clearBtn.addEventListener('click', () => {
                smsInput.value = '';
                resultsSection.classList.remove('visible');
                smsInput.focus();
            });

            // Sample chips
            sampleRow.addEventListener('click', (e) => {
                const chip = e.target.closest('.sample-chip');
                if (!chip) return;
                const key = chip.dataset.sample;
                if (SAMPLE_TEXTS[key]) {
                    smsInput.value = SAMPLE_TEXTS[key];
                    smsInput.focus();
                    resultsSection.classList.remove('visible');
                }
            });

            // Ctrl+Enter shortcut
            smsInput.addEventListener('keydown', (e) => {
                if (e.ctrlKey && e.key === 'Enter') {
                    e.preventDefault();
                    runScan();
                }
            });

            // Auto-resize textarea
            smsInput.addEventListener('input', () => {
                smsInput.style.height = 'auto';
                smsInput.style.height = Math.min(smsInput.scrollHeight, 400) + 'px';
            });

            // Initial height
            smsInput.style.height = 'auto';
            smsInput.style.height = Math.min(smsInput.scrollHeight, 400) + 'px';

            console.log('%c🛡️ Tele-Safe AI — Forensic Engine Loaded', 'color:#10b981;font-weight:bold;font-size:14px;');
            console.log('%c100% Client-Side | No External APIs | GitHub Pages Ready', 'color:#94a3b8;font-size:11px;');
            console.log('%cEthiopian Digital Wallet Screener: Telebirr & CBE', 'color:#f59e0b;font-size:11px;');
        })();
    </script>
